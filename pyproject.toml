[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "erc20-transfers"
version = "0.1.0"
description = "ERC-20 transfers done right: allowances before transferFrom, gas strategy, and transactions that are actually broadcast."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "polycratia", email = "hey@polycratia.com" }]
keywords = ["ethereum", "erc20", "web3", "blockchain", "transfers"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/polycratia/erc20-transfers"
Issues = "https://github.com/polycratia/erc20-transfers/issues"
Source = "https://github.com/polycratia/erc20-transfers"

[tool.hatch.build.targets.wheel]
packages = ["src/erc20_transfers"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
